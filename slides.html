<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.tp-root {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
  background: #000;
  user-select: none;
  -webkit-user-select: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.tp-screen {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
}

/* 1920x1080 frame; the player sets translate + scale to fit the window. It holds the slide's stage,
   two of them while a transition runs. */
.tp-frame {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  transform-origin: 0 0;
}

.tp-stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}

.tp-goto {
  display: none;
  position: absolute;
  right: 32px;
  bottom: 32px;
  z-index: 1;
  padding: 12px 24px;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.8);
  color: #fff;
  font-size: 40px;
  line-height: 1.2;
  pointer-events: none;
}

.tp-goto-on {
  display: block;
}

.tp-blank {
  display: none;
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  background: #000;
}

.tp-blanked .tp-blank {
  display: block;
}

.tp-print {
  display: none;
}

/* One slide per page: 16in x 9in is 1536x864 CSS px, so the 1920x1080 stage is scaled by 0.8. */
@page {
  size: 16in 9in;
  margin: 0;
}

@media print {
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  html, body {
    height: auto;
    overflow: visible;
    background: none;
  }

  .tp-root {
    position: static;
    overflow: visible;
    background: none;
  }

  .tp-screen {
    display: none;
  }

  .tp-print {
    display: block;
  }

  .tp-page {
    position: relative;
    width: 16in;
    height: 9in;
    overflow: hidden;
    break-after: page;
    page-break-after: always;
  }

  .tp-page:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  /* Keep this in normal flow (relative, not absolute): Chrome shrinks the whole
     print layout when an absolutely positioned transformed box is wider than the page. */
  .tp-pstage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    transform: scale(0.8);
  }
}

</style>

<script>
/* Shared slide renderer. Used by the player and the editor, so both look the same.
   Classic script, no modules. Exposes window.TalkRender.
   renderSlide(stage, slide, resolveImage, opts): opts.animate (default true) runs canvas elements every
   frame; false draws one still frame at t = 0. opts.pixelRatio overrides the canvas backing resolution.
   opts.step: show only elements whose step is <= this click (default: all). opts.showHidden: draw hidden
   elements faintly instead of leaving them out (the editor). Each drawn node carries data-step.
   setStep(stage, step, animate) reveals or hides nodes for a new click; animate fades revealed ones in.
   renderElement(e, resolveImage, opts) draws one element node (the editor re-draws while dragging).
   addFont(file, url) registers a font file so text with font: file uses it.
   Text content supports light markup: **bold**, *italic*, `code`, {#rrggbb coloured}, a backslash
   escapes one of \ * ` { }, and lines starting with "- " (or "1. ") are bullets (numbered items),
   two leading spaces per extra indent level. */
(function () {
  "use strict";

  var W = 1920;
  var H = 1080;
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var FONTS = {
    sans: FONT,
    serif: 'Georgia, Cambria, "Times New Roman", Times, serif',
    mono: 'ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace',
    rounded: 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", ' + FONT,
    condensed: '"Roboto Condensed", "Arial Narrow", "Helvetica Neue Condensed", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif-condensed, ' + FONT,
    handwritten: '"Segoe Print", "Bradley Hand", "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive'
  };
  var FONT_PREFIX = "talk-font-";
  var addedFonts = {};

  // CSS font-family for a deck font value: a built-in name or a font file registered with addFont().
  // Unknown files fall back to the default stack.
  function fontFamily(name) {
    if (Object.prototype.hasOwnProperty.call(FONTS, name)) return FONTS[name];
    return '"' + FONT_PREFIX + String(name).replace(/["\\\n]/g, "") + '", ' + FONT;
  }

  function addFont(file, url) {
    if (addedFonts[file] === url) return;
    addedFonts[file] = url;
    var st = document.createElement("style");
    st.textContent = '@font-face { font-family: "' + FONT_PREFIX + file.replace(/["\\\n]/g, "") + '"; src: url("' +
      String(url).replace(/["\\\n]/g, "") + '"); font-display: swap; }';
    document.head.appendChild(st);
  }

  // Split so the built talk.html holds nothing that looks like an external URL (build.py rejects that).
  var SVG_NS = "http:/" + "/www.w3.org/2000/svg";

  function num(v, dflt) {
    return typeof v === "number" && isFinite(v) ? v : dflt;
  }

  function place(node, e) {
    var s = node.style;
    s.position = "absolute";
    s.left = e.x + "px";
    s.top = e.y + "px";
    s.width = e.w + "px";
    s.height = e.h + "px";
    s.boxSizing = "border-box";
    s.margin = "0";
    s.transformOrigin = "50% 50%";
    var rot = num(e.rotation, 0);
    s.transform = rot ? "rotate(" + rot + "deg)" : "";
  }

  // ---- text markup --------------------------------------------------------------

  var ESCAPABLE = "\\*`{}";
  var COLOUR_OPEN = /^\{(#[0-9A-Fa-f]{6})\s/;

  function wrapNodes(tag, nodes, style) {
    var n = document.createElement(tag);
    for (var k in style) n.style[k] = style[k];
    nodes.forEach(function (c) { n.appendChild(c); });
    return n;
  }

  // Parse s from pos until the close marker (or the end). Returns {nodes, pos, closed}. An opening
  // marker that is never closed stays as literal text.
  function inline(s, pos, close) {
    var nodes = [];
    var text = "";
    var r;
    function flush() {
      if (text) nodes.push(document.createTextNode(text));
      text = "";
    }
    while (pos < s.length) {
      if (close === "*" && s.substr(pos, 2) === "**") { // bold inside italic, or the end of the italic
        r = inline(s, pos + 2, "**");
        if (r.closed && r.nodes.length) { flush(); nodes.push(wrapNodes("strong", r.nodes, { fontWeight: "bolder" })); pos = r.pos; continue; }
        flush();
        return { nodes: nodes, pos: pos + 1, closed: true };
      }
      if (close && s.substr(pos, close.length) === close) {
        flush();
        return { nodes: nodes, pos: pos + close.length, closed: true };
      }
      var c = s.charAt(pos);
      if (c === "\\" && pos + 1 < s.length && ESCAPABLE.indexOf(s.charAt(pos + 1)) >= 0) {
        text += s.charAt(pos + 1);
        pos += 2;
      } else if (s.substr(pos, 2) === "**") {
        r = inline(s, pos + 2, "**");
        if (r.closed && r.nodes.length) { flush(); nodes.push(wrapNodes("strong", r.nodes, { fontWeight: "bolder" })); pos = r.pos; }
        else { text += "**"; pos += 2; }
      } else if (c === "*") {
        r = inline(s, pos + 1, "*");
        if (r.closed && r.nodes.length) { flush(); nodes.push(wrapNodes("em", r.nodes, { fontStyle: "italic" })); pos = r.pos; }
        else { text += c; pos += 1; }
      } else if (c === "`") {
        var end = s.indexOf("`", pos + 1);
        if (end > pos + 1) {
          flush();
          nodes.push(wrapNodes("code", [document.createTextNode(s.slice(pos + 1, end))], { fontFamily: FONTS.mono, fontSize: "0.92em", background: "none", padding: "0", borderRadius: "0", color: "inherit" }));
          pos = end + 1;
        } else { text += c; pos += 1; }
      } else if (c === "{" && COLOUR_OPEN.test(s.slice(pos, pos + 9))) {
        var m = COLOUR_OPEN.exec(s.slice(pos, pos + 9));
        r = inline(s, pos + m[0].length, "}");
        if (r.closed) { flush(); nodes.push(wrapNodes("span", r.nodes, { color: m[1] })); pos = r.pos; }
        else { text += c; pos += 1; }
      } else {
        text += c;
        pos += 1;
      }
    }
    flush();
    return { nodes: nodes, pos: pos, closed: false };
  }

  var BULLETS = ["\u2022", "\u25e6", "\u25aa"];
  var LIST_RE = /^( *)(?:([-*\u2022])|(\d{1,3}[.)])) (.*)$/;

  // One block per line; list lines get a hanging indent with the marker in the gutter.
  function richLines(content) {
    var frag = document.createDocumentFragment();
    String(content).split("\n").forEach(function (line) {
      var row = document.createElement("div");
      row.style.position = "relative";
      var m = LIST_RE.exec(line);
      if (m) {
        var level = Math.floor(m[1].length / 2);
        var indent = m[3] ? 1.6 : 1.1;
        var mark = document.createElement("span");
        mark.style.position = "absolute";
        mark.style.left = level * 1.1 + "em";
        mark.textContent = m[3] || BULLETS[Math.min(level, BULLETS.length - 1)];
        row.style.paddingLeft = level * 1.1 + indent + "em";
        row.appendChild(mark);
        line = m[4];
      }
      var nodes = inline(line, 0, null).nodes;
      if (!nodes.length) row.appendChild(document.createElement("br"));
      nodes.forEach(function (n) { row.appendChild(n); });
      frag.appendChild(row);
    });
    return frag;
  }

  var VALIGN = { top: "flex-start", middle: "center", bottom: "flex-end" };

  function textEl(e) {
    var d = document.createElement("div");
    place(d, e);
    var s = d.style;
    s.fontFamily = fontFamily(e.font === undefined ? "sans" : e.font);
    s.fontSize = e.size + "px";
    s.fontWeight = e.weight;
    s.color = e.colour;
    s.textAlign = e.align;
    s.lineHeight = String(num(e.lineHeight, 1.2));
    s.display = "flex";
    s.flexDirection = "column";
    s.justifyContent = VALIGN[e.valign] || "flex-start";
    s.whiteSpace = "pre-wrap";
    s.wordWrap = "break-word";
    s.overflowWrap = "break-word";
    s.overflow = "visible";
    d.appendChild(richLines(e.content));
    return d;
  }

  // Plain text of a content string with the markup taken out (for summaries and the agent outline).
  function plainText(content) {
    return String(content).split("\n").map(function (line) {
      var m = LIST_RE.exec(line);
      var mark = m ? (m[3] || BULLETS[Math.min(Math.floor(m[1].length / 2), BULLETS.length - 1)]) + " " : "";
      return mark + inline(m ? m[4] : line, 0, null).nodes.map(function (n) { return n.textContent; }).join("");
    }).join("\n");
  }

  function placeholderEl(e) {
    var d = document.createElement("div");
    place(d, e);
    var s = d.style;
    s.display = "flex";
    s.alignItems = "center";
    s.justifyContent = "center";
    s.padding = "8px";
    s.background = "#f00";
    s.border = "4px solid #900";
    s.color = "#fff";
    s.fontFamily = FONT;
    s.fontSize = "32px";
    s.fontWeight = "700";
    s.textAlign = "center";
    s.overflow = "hidden";
    s.wordBreak = "break-all";
    d.textContent = e.file;
    return d;
  }

  function imageEl(e, resolveImage) {
    var url = typeof resolveImage === "function" ? resolveImage(e.file) : null;
    if (!url) return placeholderEl(e);
    var img = document.createElement("img");
    place(img, e);
    img.src = url;
    img.alt = "";
    img.draggable = false;
    img.style.objectFit = e.fit;
    var r = num(e.radius, 0);
    if (r > 0) img.style.borderRadius = r + "px";
    return img;
  }

  function rectEl(e) {
    var d = document.createElement("div");
    place(d, e);
    d.style.background = e.fill;
    d.style.borderRadius = e.radius + "px";
    var bw = num(e.borderWidth, 0);
    if (bw > 0) d.style.border = bw + "px solid " + (typeof e.border === "string" ? e.border : "#ffffff");
    return d;
  }

  // A straight line across its box (shape picks which way), with optional arrow heads. start is the
  // left end (the top end for a vertical line).
  function lineEnds(e) {
    var w = e.w;
    var h = e.h;
    if (e.shape === "vertical") return [w / 2, 0, w / 2, h];
    if (e.shape === "down") return [0, 0, w, h];
    if (e.shape === "up") return [0, h, w, 0];
    return [0, h / 2, w, h / 2];
  }

  function lineEl(e) {
    var svg = document.createElementNS(SVG_NS, "svg");
    place(svg, e);
    svg.style.overflow = "visible";
    svg.setAttribute("width", String(e.w));
    svg.setAttribute("height", String(e.h));
    var p = lineEnds(e);
    var t = num(e.thickness, 4);
    var len = Math.hypot(p[2] - p[0], p[3] - p[1]) || 1;
    var ux = (p[2] - p[0]) / len;
    var uy = (p[3] - p[1]) / len;
    var headL = Math.min(t * 3 + 14, len * 0.45);
    var headW = headL * 0.55 + t * 0.3;
    var a = e.arrows;
    var start = a === "start" || a === "both";
    var end = a === "end" || a === "both";
    var x1 = p[0] + (start ? ux * headL * 0.8 : 0);
    var y1 = p[1] + (start ? uy * headL * 0.8 : 0);
    var x2 = p[2] - (end ? ux * headL * 0.8 : 0);
    var y2 = p[3] - (end ? uy * headL * 0.8 : 0);
    var ln = document.createElementNS(SVG_NS, "line");
    ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
    ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
    ln.setAttribute("stroke", e.colour);
    ln.setAttribute("stroke-width", t);
    ln.setAttribute("stroke-linecap", "round");
    svg.appendChild(ln);
    function head(tx, ty, dx, dy) {
      var bx = tx - dx * headL;
      var by = ty - dy * headL;
      var poly = document.createElementNS(SVG_NS, "polygon");
      poly.setAttribute("points", [tx, ty, bx - dy * headW, by + dx * headW, bx + dy * headW, by - dx * headW].join(" "));
      poly.setAttribute("fill", e.colour);
      svg.appendChild(poly);
    }
    if (start) head(p[0], p[1], -ux, -uy);
    if (end) head(p[2], p[3], ux, uy);
    return svg;
  }

  // ---- canvas elements --------------------------------------------------------
  // The element's code runs once when the slide is drawn, with ctx, canvas, width, height and fontFamily
  // in scope (width/height are the element's box in slide units, ctx is scaled to match). If it defines
  // draw(t, frame), that is called every animation frame with t = seconds since the slide was drawn,
  // after the canvas is cleared. Errors are drawn on the canvas instead of thrown.

  var running = []; // {canvas, ctx, draw, start, frame, w, h}
  var rafId = null;

  function showError(ctx, w, h, err) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    var k = ctx.canvas.width / w;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.fillStyle = "rgba(120, 0, 0, 0.85)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 32px " + FONT;
    ctx.textBaseline = "top";
    var msg = String(err && err.message ? err.message : err);
    var line = (err && err.name ? err.name + ": " : "") + msg;
    var words = line.split(/\s+/);
    var y = 20;
    var cur = "";
    for (var i = 0; i < words.length && y < h - 40; i++) {
      var next = cur ? cur + " " + words[i] : words[i];
      if (cur && ctx.measureText(next).width > w - 40) {
        ctx.fillText(cur, 20, y);
        y += 40;
        cur = words[i];
      } else {
        cur = next;
      }
    }
    if (cur && y < h - 40) ctx.fillText(cur, 20, y);
  }

  function drawFrame(r, now) {
    var t = (now - r.start) / 1000;
    var k = r.canvas.width / r.w;
    r.ctx.setTransform(1, 0, 0, 1, 0, 0);
    r.ctx.clearRect(0, 0, r.canvas.width, r.canvas.height);
    r.ctx.setTransform(k, 0, 0, k, 0, 0);
    r.ctx.save();
    try {
      r.draw(t, r.frame++);
    } catch (err) {
      showError(r.ctx, r.w, r.h, err);
      return false;
    } finally {
      r.ctx.restore();
    }
    return true;
  }

  function tick(now) {
    rafId = null;
    running = running.filter(function (r) {
      return r.canvas.isConnected && drawFrame(r, now);
    });
    if (running.length) rafId = window.requestAnimationFrame(tick);
  }

  function canvasEl(e, opts) {
    var c = document.createElement("canvas");
    place(c, e);
    c.style.display = "block";
    var ratio = opts.pixelRatio > 0 ? opts.pixelRatio : Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    c.width = Math.max(1, Math.round(e.w * ratio));
    c.height = Math.max(1, Math.round(e.h * ratio));
    var ctx = c.getContext("2d");
    if (!ctx) return c;
    var k = c.width / e.w;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    var draw;
    try {
      var setup = new Function("ctx", "canvas", "width", "height", "fontFamily",
        String(e.code) + "\n;return typeof draw === \"function\" ? draw : null;");
      ctx.save();
      try {
        draw = setup(ctx, c, e.w, e.h, fontFamily);
      } finally {
        ctx.restore();
      }
    } catch (err) {
      showError(ctx, e.w, e.h, err);
      return c;
    }
    if (typeof draw !== "function") return c;
    var r = { canvas: c, ctx: ctx, draw: draw, start: 0, frame: 0, w: e.w, h: e.h };
    c.talkRun = r;
    if (opts.animate === false) {
      drawFrame(r, 0);
      return c;
    }
    r.start = window.performance.now();
    drawFrame(r, r.start);
    running.push(r);
    if (rafId === null) rafId = window.requestAnimationFrame(tick);
    return c;
  }

  function stepOf(e) {
    var v = num(e.step, 0);
    return v > 0 ? Math.floor(v) : 0;
  }

  // The highest click number on a slide (0 = no builds), counting only elements that are shown.
  function maxStep(slide) {
    var m = 0;
    (slide.elements || []).forEach(function (e) {
      if (!e.hidden) m = Math.max(m, stepOf(e));
    });
    return m;
  }

  function renderElement(e, resolveImage, opts) {
    opts = opts || {};
    var node = null;
    if (e.type === "text") node = textEl(e);
    else if (e.type === "image") node = imageEl(e, resolveImage);
    else if (e.type === "rect") node = rectEl(e);
    else if (e.type === "line") node = lineEl(e);
    else if (e.type === "canvas") node = canvasEl(e, opts);
    if (!node) return null;
    var op = Math.max(0, Math.min(1, num(e.opacity, 1)));
    if (e.hidden) op *= 0.3;
    if (op < 1) node.style.opacity = String(op);
    node.setAttribute("data-step", String(stepOf(e)));
    return node;
  }

  function showNode(node, on, animate) {
    var was = node.style.visibility !== "hidden";
    node.style.visibility = on ? "" : "hidden";
    if (!on || was) return;
    if (node.talkRun) { // a canvas starts its animation when it appears
      node.talkRun.start = window.performance.now();
      node.talkRun.frame = 0;
    }
    if (animate && node.animate) {
      node.animate([{ opacity: 0 }, { opacity: node.style.opacity || 1 }], { duration: 350, easing: "ease-out" });
    }
  }

  function setStep(stageEl, step, animate) {
    Array.prototype.forEach.call(stageEl.children, function (node) {
      var st = Number(node.getAttribute("data-step")) || 0;
      showNode(node, st <= step, animate);
    });
  }

  function renderSlide(stageEl, slide, resolveImage, opts) {
    opts = opts || {};
    while (stageEl.firstChild) stageEl.removeChild(stageEl.firstChild);
    // Absolute children need a positioned stage. Only touch it when it is static,
    // so a caller that positions the stage itself keeps control.
    if (window.getComputedStyle(stageEl).position === "static") stageEl.style.position = "relative";
    stageEl.style.width = W + "px";
    stageEl.style.height = H + "px";
    stageEl.style.background = "";
    stageEl.style.backgroundColor = slide.background;

    var frag = document.createDocumentFragment();
    var els = slide.elements || [];
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (e.hidden && !opts.showHidden) continue;
      var node = renderElement(e, resolveImage, opts);
      if (!node) continue;
      if (typeof opts.step === "number" && stepOf(e) > opts.step) node.style.visibility = "hidden";
      frag.appendChild(node);
    }
    stageEl.appendChild(frag);
  }

  window.TalkRender = {
    W: W, H: H, FONTS: FONTS, renderSlide: renderSlide, renderElement: renderElement, setStep: setStep,
    maxStep: maxStep, stepOf: stepOf, plainText: plainText, lineEnds: lineEnds, addFont: addFont, fontFamily: fontFamily
  };
})();

/* Slideshow player. Needs window.TalkRender (render.js) loaded first.
   Classic script, no modules. Exposes window.TalkPlayer.start(rootEl, deck, resolveImage). */
(function () {
  "use strict";

  var GOTO_TIMEOUT_MS = 3000; // typed slide number is dropped after this long without a key
  var GOTO_MAX_DIGITS = 5;

  function div(cls) {
    var d = document.createElement("div");
    d.className = cls;
    return d;
  }

  function start(rootEl, deck, resolveImage) {
    var slides = deck.slides;
    var n = slides.length;
    if (!n) return;

    var current = -1;
    var step = 0; // clicks shown on the current slide (elements with step <= this are visible)
    var blanked = false;
    var pending = "";
    var pendingTimer = null;
    var TRANSITION_MS = 450;

    while (rootEl.firstChild) rootEl.removeChild(rootEl.firstChild);
    rootEl.classList.add("tp-root");

    // Screen view: a frame scaled to the window holding the current slide's stage (two stages while a
    // transition runs). The goto overlay sits below the blank cover so nothing leaks to the projector.
    var screen = div("tp-screen");
    var frame = div("tp-frame");
    var stage = null;
    var leaving = []; // stages animating out
    var gotoEl = div("tp-goto");
    var blankEl = div("tp-blank");
    screen.appendChild(frame);
    screen.appendChild(gotoEl);
    screen.appendChild(blankEl);
    rootEl.appendChild(screen);

    // Print view: every slide in its own page, fully built. Hidden on screen, shown by the print stylesheet.
    var printEl = div("tp-print");
    for (var i = 0; i < n; i++) {
      var page = div("tp-page");
      var pstage = div("tp-pstage");
      page.appendChild(pstage);
      printEl.appendChild(page);
      window.TalkRender.renderSlide(pstage, slides[i], resolveImage, { animate: false, pixelRatio: 1 });
    }
    rootEl.appendChild(printEl);

    function clamp(i) {
      return Math.max(0, Math.min(n - 1, i));
    }

    function maxStep(i) {
      return window.TalkRender.maxStep(slides[i]);
    }

    function layout() {
      var vw = rootEl.clientWidth || window.innerWidth;
      var vh = rootEl.clientHeight || window.innerHeight;
      var s = Math.min(vw / window.TalkRender.W, vh / window.TalkRender.H);
      var x = (vw - window.TalkRender.W * s) / 2;
      var y = (vh - window.TalkRender.H * s) / 2;
      frame.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
    }

    // Hash is #N or #N.S (1-based slide N, click S). Anything unparsable means slide 1; out of range is clamped later.
    function parseHash() {
      var m = /^#(-?\d+)(?:\.(\d+))?$/.exec(window.location.hash);
      return m ? { slide: parseInt(m[1], 10) - 1, step: m[2] ? parseInt(m[2], 10) : 0 } : { slide: 0, step: 0 };
    }

    function writeHash() {
      var h = "#" + (current + 1) + (step ? "." + step : "");
      if (window.location.hash === h) return;
      try {
        window.history.replaceState(null, "", h);
      } catch (err) {
        try { window.location.replace(h); } catch (err2) { /* leave the hash alone */ }
      }
    }

    function dropLeaving() {
      leaving.forEach(function (st) { if (st.parentNode) st.parentNode.removeChild(st); });
      leaving = [];
    }

    // Animate from the old stage to the new one: "fade" cross-fades, "slide" pushes in from the side
    // of travel (dir 1 = forwards). Without the Web Animations API it is a plain cut.
    function transition(oldStage, newStage, kind, dir) {
      if (!oldStage) return;
      if (oldStage.getAnimations) oldStage.getAnimations().forEach(function (a) { a.cancel(); });
      leaving.push(oldStage);
      if (!newStage.animate || kind === "none" || !kind) { dropLeaving(); return; }
      var anim;
      var opts = { duration: TRANSITION_MS, easing: "ease-in-out" };
      if (kind === "fade") {
        anim = newStage.animate([{ opacity: 0 }, { opacity: 1 }], opts);
      } else {
        var w = window.TalkRender.W * (dir < 0 ? -1 : 1);
        anim = newStage.animate([{ transform: "translateX(" + w + "px)" }, { transform: "translateX(0)" }], opts);
        oldStage.animate([{ transform: "translateX(0)" }, { transform: "translateX(" + -w + "px)" }], { duration: TRANSITION_MS, easing: "ease-in-out", fill: "forwards" });
      }
      anim.onfinish = anim.oncancel = function () {
        var at = leaving.indexOf(oldStage);
        if (at >= 0) {
          leaving.splice(at, 1);
          if (oldStage.parentNode) oldStage.parentNode.removeChild(oldStage);
        }
      };
    }

    // Show slide i at click st ("end" = fully built). dir is the direction of travel for transitions;
    // 0 (or force) is a cut, used for the first show and jumps from the address bar.
    function show(i, st, dir, force) {
      i = clamp(i);
      var max = maxStep(i);
      st = st === "end" ? max : Math.max(0, Math.min(max, st || 0));
      if (i !== current || force) {
        dropLeaving();
        var old = stage;
        stage = div("tp-stage");
        frame.appendChild(stage);
        window.TalkRender.renderSlide(stage, slides[i], resolveImage, { step: st });
        if (old) transition(old, stage, dir && !force ? slides[i].transition : "none", dir);
        current = i;
        step = st;
      } else if (st !== step) {
        window.TalkRender.setStep(stage, st, st > step);
        step = st;
      }
      writeHash();
    }

    function next() {
      if (step < maxStep(current)) show(current, step + 1, 1);
      else if (current < n - 1) show(current + 1, 0, 1);
    }

    function prev() {
      if (step > 0) show(current, step - 1, -1);
      else if (current > 0) show(current - 1, "end", -1);
    }

    function setBlank(b) {
      blanked = b;
      rootEl.classList.toggle("tp-blanked", b);
    }

    // Every navigation also un-blanks. go(i) jumps to the start of slide i.
    function go(i) {
      setBlank(false);
      show(i, 0, i > current ? 1 : -1);
    }

    function stepBy(d) {
      setBlank(false);
      if (d > 0) next();
      else prev();
    }

    function showPending() {
      gotoEl.textContent = pending + " / " + n;
      gotoEl.classList.add("tp-goto-on");
    }

    function clearPending() {
      pending = "";
      if (pendingTimer) clearTimeout(pendingTimer);
      pendingTimer = null;
      gotoEl.classList.remove("tp-goto-on");
    }

    function typeDigit(d) {
      if (pending.length < GOTO_MAX_DIGITS) pending += d;
      showPending();
      if (pendingTimer) clearTimeout(pendingTimer);
      pendingTimer = setTimeout(clearPending, GOTO_TIMEOUT_MS);
    }

    function toggleFullscreen() {
      try {
        var p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      } catch (err) { /* ignore */ }
    }

    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key;
      if (k.length === 1 && k >= "0" && k <= "9") {
        typeDigit(k);
        e.preventDefault();
        return;
      }
      switch (k) {
        case "ArrowRight":
        case "ArrowDown":
        case " ":
        case "PageDown":
          stepBy(1);
          break;
        case "ArrowLeft":
        case "ArrowUp":
        case "PageUp":
          stepBy(-1);
          break;
        case "Home":
          go(0);
          break;
        case "End":
          go(n - 1);
          break;
        case "Enter":
          if (pending) {
            var target = parseInt(pending, 10) - 1;
            clearPending();
            go(target);
          }
          break;
        case "Escape":
          clearPending();
          break;
        case "f":
        case "F":
          if (!e.repeat) toggleFullscreen();
          break;
        case "b":
        case "B":
          if (!e.repeat) setBlank(!blanked);
          break;
        default:
          return;
      }
      e.preventDefault();
    }

    document.addEventListener("keydown", onKey);
    rootEl.addEventListener("click", function (e) {
      if (e.button === 0) stepBy(1);
    });
    window.addEventListener("resize", layout);
    window.addEventListener("hashchange", function () {
      var h = parseHash();
      show(h.slide, h.step, 0);
    });

    layout();
    var h0 = parseHash();
    show(h0.slide, h0.step, 0, true);
  }

  window.TalkPlayer = { start: start };
})();

(function () {
  var data = JSON.parse(document.getElementById("deck-data").textContent);
  Object.keys(data.fonts || {}).forEach(function (name) {
    TalkRender.addFont(name, data.fonts[name]);
  });
  TalkPlayer.start(document.getElementById("talk"), data.deck, function (name) {
    return data.images[name] || null;
  });
})();
</script>
</body>
</html>
